name: Deploy PlanFix to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Configure the GitHub Pages project path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base = '/PlanFix/'
          for name in ['src/app.js', 'src/landing.mjs']:
              p = Path(name)
              s = p.read_text()
              s = s.replace('/assets/', base + 'assets/')
              s = s.replace('href="/"', 'href="' + base + '"')
              s = s.replace('new URL(location.origin)', 'new URL(location.origin + "' + base + '")')
              s = s.replace("location.origin+'/'", 'location.origin+"' + base + '"')
              p.write_text(s)
          for name in ['dist/index.html', 'dist/setup/index.html']:
              p = Path(name)
              s = p.read_text()
              s = s.replace('href="/', 'href="' + base)
              s = s.replace('src="/', 'src="' + base)
              s = s.replace('https://planfix-social-plans.glitteringmotor3.chatgpt.site/', 'https://glak199.github.io/PlanFix/')
              s = s.replace('https://planfix-social-plans.glitteringmotor3.chatgpt.site', 'https://glak199.github.io')
              p.write_text(s)
          PY
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
