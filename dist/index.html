<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#2455f5"><meta name="description" content="PlanFix organizes plan details, group invitations, and voting in one shared workspace. Sign in with Google to create a plan and confirm your next decision."><title>PlanFix — Create plans. Collect votes. Confirm decisions.</title><style id="launch-styles">
#launch-screen{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:17px;background:#fafbf8;color:#172747;font-family:'Plus Jakarta Sans',system-ui,sans-serif;transition:opacity 180ms ease;isolation:isolate}
#launch-screen::before{content:'';position:absolute;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,#eaf0ff 0%,#fafbf800 70%);z-index:-1}
.launch-logo{display:block;width:72px;height:72px;filter:drop-shadow(0 8px 18px #2455f51b)}
.launch-wordmark{font-size:42px;font-weight:800;line-height:1.2;letter-spacing:-1.9px;margin:3px 0 0}.launch-wordmark span{color:#2455f5}
.launch-message{font-size:12px;line-height:1.7;color:#8493aa;margin:0;letter-spacing:.2px}
.launch-dots{display:flex;gap:6px;margin-top:2px}.launch-dots span{width:5px;height:5px;border-radius:50%;background:#2455f5;animation:launch-pulse 950ms ease-in-out infinite}.launch-dots span:nth-child(2){animation-delay:130ms}.launch-dots span:nth-child(3){animation-delay:260ms;background:#9bcf6e}
#launch-screen.launch-leaving{opacity:0}
@keyframes launch-pulse{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@media(prefers-reduced-motion:reduce){#launch-screen{transition:none}.launch-dots span{animation:none;opacity:.7}}
</style><script>
(function(){
 var started=performance.now(),finished=false,scheduled=false,watchdog;
 function remove(){var screen=document.getElementById('launch-screen'),app=document.getElementById('app');if(screen)screen.remove();if(app){app.removeAttribute('inert');app.removeAttribute('aria-hidden')}}
 function reveal(){if(finished)return;finished=true;clearTimeout(watchdog);var screen=document.getElementById('launch-screen');if(screen)screen.classList.add('launch-leaving');setTimeout(remove,window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches?0:180)}
 window.PLANFIX_LAUNCH={ready:function(){if(scheduled||finished)return;scheduled=true;setTimeout(reveal,Math.max(0,850-(performance.now()-started)))}};
 watchdog=setTimeout(function(){var fallback=document.getElementById('app-loading');if(fallback)fallback.textContent='PlanFix is taking longer to open. Please refresh to try again.';reveal()},4500);
 window.addEventListener('pageshow',function(event){if(event.persisted){finished=true;clearTimeout(watchdog);remove()}});
})();
</script><link rel="icon" type="image/svg+xml" href="/assets/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;650;700;750;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"><script src="/config.js"></script><script defer src="/app.js"></script></head><body><div id="launch-screen" role="status" aria-live="polite" aria-label="PlanFix — opening the website"><svg class="launch-logo" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="19" fill="#2455f5"/><path d="M18 34l10 10 20-24M18 20h13" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="49" cy="49" r="7" fill="#b7f277"/></svg><p class="launch-wordmark">Plan<span>Fix</span></p><p class="launch-message">Opening the website…</p><div class="launch-dots" aria-hidden="true"><span></span><span></span><span></span></div></div><noscript><style>#launch-screen,#app{display:none}</style><p style="padding:30px;font-family:system-ui">Please enable JavaScript to open PlanFix.</p></noscript><div id="app" inert aria-hidden="true"><p id="app-loading" style="padding:40px;font-family:sans-serif;color:#2455f5" role="status">Getting your PlanFix space ready…</p></div><dialog id="modal"></dialog><div id="toast" role="status" aria-live="polite"></div></body></html>
